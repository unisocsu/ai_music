name: Generate song with HeartMuLa (experimental CPU)

on:
  workflow_dispatch:
    inputs:
      song_prompt:
        description: "Extra description of the song"
        required: false
        type: string
      lyrics:
        description: "Lyrics to sing (multilingual quality varies)"
        required: true
        type: string
      style:
        description: "Genre, mood, instruments, and vocal style"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: generate-heartmula-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    # HeartMuLa 3B is large. CPU-only GitHub runners may run out of RAM or take a long time.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SONG_PROMPT: ${{ inputs.song_prompt }}
      LYRICS: ${{ inputs.lyrics }}
      STYLE: ${{ inputs.style }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install uv
        run: pip install uv

      - name: Clone and install official HeartMuLa library
        run: |
          git clone --depth 1 https://github.com/HeartMuLa/heartlib.git heartlib
          cd heartlib
          # Upstream metadata currently advertises Python 3.9, but pinned dependencies
          # require Python 3.10+. Narrow the supported range for this CI checkout.
          sed -i 's/requires-python = ">=3.9"/requires-python = ">=3.10"/' pyproject.toml
          uv sync --no-dev

      - name: Download HeartMuLa model checkpoints
        working-directory: heartlib
        run: |
          uv run hf download HeartMuLa/HeartMuLaGen gen_config.json tokenizer.json --local-dir ./ckpt
          uv run hf download HeartMuLa/HeartMuLa-oss-3B-happy-new-year --local-dir ./ckpt/HeartMuLa-oss-3B
          uv run hf download HeartMuLa/HeartCodec-oss-20260123 --local-dir ./ckpt/HeartCodec-oss

      - name: Generate audio (CPU, experimental)
        run: |
          cp generate_heartmula.py heartlib/generate_heartmula.py
          cd heartlib
          uv run python generate_heartmula.py

      - name: Upload generated audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-song-heartmula
          path: output/*.mp3
          if-no-files-found: error
          retention-days: 7
