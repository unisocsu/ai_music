name: Generate song with HeartMuLa (experimental CPU)

on:
  workflow_dispatch:
    inputs:
      song_prompt:
        description: "Extra description of the song"
        required: false
        type: string
      lyrics:
        description: "Lyrics to sing (multilingual quality varies)"
        required: true
        type: string
      style:
        description: "Genre, mood, instruments, and vocal style"
        required: true
        type: string
      duration_seconds:
        description: "Target song duration in seconds"
        required: true
        type: choice
        default: "60"
        options:
          - "30"
          - "60"
          - "90"
          - "120"
          - "180"

permissions:
  contents: read

concurrency:
  group: generate-heartmula-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    # HeartMuLa 3B is large. CPU-only GitHub runners may run out of RAM or take a long time.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SONG_PROMPT: ${{ inputs.song_prompt }}
      LYRICS: ${{ inputs.lyrics }}
      STYLE: ${{ inputs.style }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install uv
        run: pip install uv

      - name: Clone official HeartMuLa library
        run: |
          git clone --depth 1 https://github.com/HeartMuLa/heartlib.git heartlib
          cd heartlib
          # Upstream metadata currently advertises Python 3.9, but pinned dependencies
          # require Python 3.10+. Narrow the supported range for this CI checkout.
          sed -i 's/requires-python = ">=3.9"/requires-python = ">=3.10"/' pyproject.toml

      # Reuse downloaded Python wheels and the large model checkpoints between runs.
      - name: Restore Python package cache
        id: uv-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-heartmula-py310-v1-${{ hashFiles('heartlib/uv.lock', 'heartlib/pyproject.toml') }}

      - name: Restore HeartMuLa checkpoints
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: heartlib/ckpt
          key: heartmula-checkpoints-2026-01-v1

      - name: Install HeartMuLa dependencies
        run: |
          cd heartlib
          uv sync --no-dev
          # Heartlib currently resolves an old Datasets release, which expects PyExtensionType.
          # Pin Arrow to the last compatible major version and upgrade Datasets together.
          uv pip install --python .venv/bin/python --reinstall "pyarrow==19.0.1" "datasets==3.6.0" "huggingface-hub==0.36.2" "torchcodec==0.10.0"
          uv run --no-sync python -c 'import numpy, pyarrow, datasets, huggingface_hub, transformers, torchcodec; print("numpy=" + numpy.__version__ + ", pyarrow=" + pyarrow.__version__ + ", datasets=" + datasets.__version__ + ", huggingface_hub=" + huggingface_hub.__version__ + ", transformers=" + transformers.__version__ + ", torchcodec=" + torchcodec.__version__)'

      - name: Save Python package cache
        if: steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/uv
          key: uv-heartmula-py310-v1-${{ hashFiles('heartlib/uv.lock', 'heartlib/pyproject.toml') }}

      - name: Download HeartMuLa model checkpoints
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: heartlib
        run: |
          uv run --no-sync hf download HeartMuLa/HeartMuLaGen gen_config.json tokenizer.json --local-dir ./ckpt
          uv run --no-sync hf download HeartMuLa/HeartMuLa-oss-3B-happy-new-year --local-dir ./ckpt/HeartMuLa-oss-3B
          uv run --no-sync hf download HeartMuLa/HeartCodec-oss-20260123 --local-dir ./ckpt/HeartCodec-oss

      - name: Save HeartMuLa checkpoint cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: heartlib/ckpt
          key: heartmula-checkpoints-2026-01-v1

      - name: Generate audio (CPU, experimental)
        run: |
          cp generate_heartmula.py heartlib/generate_heartmula.py
          cd heartlib
          uv run --no-sync python generate_heartmula.py

      - name: Upload generated audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-song-heartmula
          path: output/*.mp3
          if-no-files-found: error
          retention-days: 7
