name: Generate music (Stable Audio Open Small CPU)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Describe the music in Hebrew or English
        required: true
        type: string
        default: "שיר פופ שמח עם פסנתר, תופים וגיטרה, קצב בינוני, מנגינה קליטה"
      duration:
        description: Duration in seconds (maximum 11 seconds)
        required: true
        type: choice
        options:
          - "8"
          - "11"
        default: "8"
      steps:
        description: Sampling steps (lower is usually faster)
        required: true
        type: choice
        options:
          - "4"
          - "8"
          - "12"
        default: "4"

permissions:
  contents: read

concurrency:
  group: stable-audio-open-small-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DURATION: ${{ inputs.duration }}
      STEPS: ${{ inputs.steps }}
      ORIGINAL_PROMPT: ${{ inputs.prompt }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-stable-audio-open-small.txt

      - name: Translate Hebrew prompt to English (optional)
        id: prompt
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install deep-translator
          python scripts/prepare_music_prompt.py

      - name: Cache Stable Audio Open Small model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: stable-audio-open-small-public-v2-${{ runner.os }}-py311

      - name: Install Stable Audio Tools and compatible CPU PyTorch
        run: |
          python -m pip install -r requirements-stable-audio-open-small.txt
          # Keep the PyTorch family on matching CPU wheels; otherwise torchvision
          # may fail at import with "operator torchvision::nms does not exist".
          python -m pip install --force-reinstall --no-deps torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Generate with Stable Audio Open Small (no token)
        env:
          PROMPT_EN: ${{ steps.prompt.outputs.prompt_en || inputs.prompt }}
        run: |
          mkdir -p output
          python scripts/generate_stable_audio_open_small.py

      - name: Upload generated audio
        if: always() && hashFiles('output/music.wav') != ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-music-stable-audio-open-small-${{ github.run_number }}
          path: output/music.wav
          if-no-files-found: error
          retention-days: 14
