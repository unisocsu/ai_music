name: Generate song with ACE-Step

on:
  workflow_dispatch:
    inputs:
      song_prompt:
        description: "Describe the song (Hebrew or English)"
        required: true
        type: string
      lyrics:
        description: "Optional lyrics; section labels like [Verse], [Chorus], [Outro] can help structure the song"
        required: false
        type: string
      style:
        description: "Optional genre, mood, instruments, and vocal style"
        required: false
        type: string
      duration_seconds:
        description: "Target song duration in seconds; 30s is recommended for CPU-only runners"
        required: true
        type: choice
        default: "30"
        options:
          - "30"
          - "60"
          - "90"
          - "120"
          - "180"

permissions:
  contents: read

concurrency:
  group: generate-song-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    # Standard GitHub-hosted runner: CPU only; generation may be very slow.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SONG_PROMPT: ${{ inputs.song_prompt }}
      LYRICS: ${{ inputs.lyrics }}
      STYLE: ${{ inputs.style }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      ACESTEP_LLM_BACKEND: pt
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install uv
        run: pip install uv

      - name: Clone ACE-Step 1.5
        run: git clone --depth 1 https://github.com/ACE-Step/ACE-Step-1.5.git .ace-step

      # Keep Python wheels and downloaded model weights across runs.
      - name: Restore Python package cache
        id: uv-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-acestep-py311-v1-${{ hashFiles('.ace-step/uv.lock', '.ace-step/pyproject.toml') }}

      - name: Restore ACE-Step model weights
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: .ace-step/checkpoints
          key: acestep-models-v15-turbo-lm06-v1

      - name: Install ACE-Step 1.5
        run: |
          cd .ace-step
          uv sync

      - name: Save Python package cache
        if: steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: uv-acestep-py311-v1-${{ hashFiles('.ace-step/uv.lock', '.ace-step/pyproject.toml') }}

      - name: Download model weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: .ace-step
        run: |
          uv run acestep-download --model main
          uv run acestep-download --model acestep-5Hz-lm-0.6B --skip-main

      - name: Save ACE-Step model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .ace-step/checkpoints
          key: acestep-models-v15-turbo-lm06-v1

      - name: Generate real audio
        env:
          ACESTEP_ROOT: ${{ github.workspace }}/.ace-step
        run: |
          PYTHONPATH="${{ github.workspace }}/.ace-step" uv run --project .ace-step python generate_song.py

      - name: Upload generated audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-song
          path: output/*.mp3
          if-no-files-found: error
          retention-days: 7
