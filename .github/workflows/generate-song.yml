name: Generate song with ACE-Step

on:
  workflow_dispatch:
    inputs:
      song_prompt:
        description: "Describe the song (Hebrew or English)"
        required: true
        type: string
      lyrics:
        description: "Optional lyrics; leave empty for an instrumental track"
        required: false
        type: string
      style:
        description: "Optional genre, mood, instruments, and vocal style"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: generate-song-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    # Standard GitHub-hosted runner: CPU only; generation may be very slow.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SONG_PROMPT: ${{ inputs.song_prompt }}
      LYRICS: ${{ inputs.lyrics }}
      STYLE: ${{ inputs.style }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      ACESTEP_LLM_BACKEND: pt
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Clone and install ACE-Step 1.5
        run: |
          git clone --depth 1 https://github.com/ACE-Step/ACE-Step-1.5.git .ace-step
          cd .ace-step
          uv sync

      - name: Download model weights
        working-directory: .ace-step
        run: |
          uv run acestep-download --model acestep-v15-turbo
          uv run acestep-download --model acestep-5Hz-lm-0.6B

      - name: Generate real audio
        env:
          ACESTEP_ROOT: ${{ github.workspace }}/.ace-step
        run: |
          PYTHONPATH="${{ github.workspace }}/.ace-step" uv run --project .ace-step python generate_song.py

      - name: Upload generated audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-song
          path: output/
          if-no-files-found: warn
          retention-days: 7
